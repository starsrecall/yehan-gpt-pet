<!doctype html>
<!-- 本地结构夹具，只模拟适配节点和交互；不包含真实账户、会话或远程资源。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夜航 · 本地网页验证夹具</title>
  <style>
    :root { --bg-primary:#fff; --sidebar-surface-primary:#f5f5f5; --text-primary:#161616; --main-surface-primary:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.65 system-ui,sans-serif; color:var(--text-primary); background:#fff; }
    button,a { color:inherit; font:inherit; }
    button { cursor:pointer; }
    .app { min-height:100vh; display:grid; grid-template-columns:260px 1fr; background:var(--bg-primary); }
    #sidebar { padding:26px 18px; background:var(--sidebar-surface-primary); }
    .brand { font-size:19px; font-weight:650; margin-bottom:28px; }
    .nav { display:flex; flex-direction:column; gap:8px; }
    .nav a { padding:10px 14px; text-decoration:none; border-radius:10px; }
    .nav a:first-child { background:rgb(118 217 255 / .08); }
    .nav small { color:#8c9cad; margin:26px 14px 4px; }
    main { min-width:0; background:var(--main-surface-primary); }
    header { display:flex; justify-content:space-between; align-items:center; height:76px; padding:0 32px; }
    .label { display:inline-block; font-size:12px; border:1px solid rgb(118 217 255 / .30); border-radius:30px; padding:4px 12px; color:#9eb9ca; }
    #thread { max-width:860px; margin:50px auto 0; padding:0 32px; }
    .hero { margin:0 0 12px; font-size:36px; font-weight:570; letter-spacing:.02em; }
    .intro { color:#a5b5ca; margin:0 0 28px; }
    .message { padding:20px 24px; margin:18px 0; border-radius:18px; border:1px solid rgb(151 193 228 / .14); }
    .user { margin-left:180px; background:rgb(18 37 57 / .85); }
    .assistant { margin-bottom:40px; background:rgb(10 19 34 / .70); }
    .message p { margin:0 0 12px; }
    .message p:last-child { margin:0; }
    .author { font-size:12px; color:#76d9ff; margin-bottom:10px; }
    #composer-background { border-radius:24px; padding:20px; margin-top:24px; min-height:150px; background:#fff; }
    #prompt-textarea { min-height:58px; outline:none; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
    #send-button { border:0; width:36px; height:36px; border-radius:50%; background:#76d9ff; color:#061423; font-size:20px; }
    #attach-button { background:transparent; border:1px solid #678096; border-radius:50%; width:32px; height:32px; font-size:20px; }
    .note { text-align:center; color:#8ba1b9; font-size:11px; padding:18px; }
    @media(max-width:800px) { .app {grid-template-columns:190px 1fr;} #thread {padding:0 18px; margin-top:25px;} .user {margin-left:20px;} }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" data-testid="sidebar">
      <div class="brand">◈ &nbsp; ChatGPT</div>
      <nav class="nav">
        <a href="#new">＋ &nbsp; 新聊天</a><a href="#search">⌕ &nbsp; 搜索聊天</a><a href="#library">▦ &nbsp; 图片</a>
        <small>项目</small><a href="#project">▱ &nbsp; 奇奇怪怪的东西</a>
        <small>最近的聊天</small><a href="#theme">夜航 · 网页皮肤</a><a href="#idea">让灵感继续发光</a><a href="#test">一个自己的小宇宙</a>
      </nav>
    </aside>
    <main id="main" class="bg-token-bg-primary">
      <header><span>ChatGPT &nbsp;⌄</span><span class="label">本地测试夹具 · 无真实会话</span></header>
      <section id="thread">
        <h1 class="hero">留一点空间，给自己的宇宙。</h1>
        <p class="intro">夜航 · 一张本机壁纸，一层安静的蓝色玻璃。</p>
        <article class="message user"><div class="author">你</div>让聊天的地方，更像我喜欢的样子。</article>
        <article class="message assistant"><div class="author">ChatGPT</div><p>壁纸已经就位。输入、按钮和聊天布局继续使用原有网页结构。</p><p>透明度、模糊和强调色可以在扩展设置中调整，所有素材保存在本机。</p></article>
        <form id="composer-background" data-testid="composer">
          <div id="prompt-textarea" role="textbox" aria-label="输入消息" contenteditable="true" data-placeholder="发消息"></div>
          <div class="toolbar"><button id="attach-button" type="button" aria-label="附件">＋</button><button id="send-button" type="button" aria-label="发送">↑</button></div>
        </form>
        <div class="note">该截图为浏览器加载真实扩展后的本地验证页面。</div>
      </section>
    </main>
  </div>
</body>
</html>
