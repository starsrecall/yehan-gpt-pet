<!doctype html>
<!-- 视觉回归夹具：原生布局和语义表面模拟，非用户实机 DOM，不包含真实对话或账号。 -->
<html lang="zh-CN" data-nebula-preset="host-before">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>夜航 · 线框蓝光验证夹具</title>
  <style>
    @layer theme, base, components, utilities;
    @layer theme { :root { --bg-primary:#30343f; --sidebar-surface-primary:#30343f; --text-primary:#edf4ff; } }
    @layer base { * { box-sizing:border-box; } body { margin:0; font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif; color:var(--text-primary); background:var(--bg-primary); } button,a { font:inherit; color:inherit; } button { cursor:pointer; } }
    @layer components {
      .app { display:grid; grid-template-columns:280px minmax(0,1fr); height:100vh; background:var(--bg-primary); }
      #sidebar { min-width:0; display:flex; flex-direction:column; background:var(--sidebar-surface-primary); }
      .brand { display:flex; justify-content:space-between; font-size:22px; }
      nav { flex:1; overflow:auto; }
      nav a { display:block; text-decoration:none; border:1px solid transparent; border-radius:8px; }
      nav a:hover { background:var(--sidebar-surface-secondary,#444); }
      .new-chat { border-color:#52deff55; background:#1a466b22; color:#c7f4ff; }
      nav small { display:block; color:#8ca5bc; font-size:11px; letter-spacing:2px; }
      nav a[aria-current] { background:#1b455d66; }
      footer { flex-shrink:0; background:var(--sidebar-surface-primary); border-top:1px solid #52deff22; }
      main { position:relative; min-width:0; display:flex; flex-direction:column; }
      main header { display:flex; justify-content:space-between; align-items:center; }
      .fixture-tag { font-size:11px; color:#9ac6dc; background:#071424aa; border-radius:30px; }
      #thread { width:min(1020px,calc(100% - 96px)); margin:auto; }
      h1 { font-size:38px; font-weight:500; text-align:center; text-shadow:0 2px 16px #000b; }
      .subtitle { color:#a6bfd0; text-align:center; font-size:14px; }
      .context { display:flex; gap:12px; }
      .context span { border:1px solid #52deff44; border-radius:20px; background:#06203780; font-size:13px; }
      #composer-form { margin:0; border-radius:0; }
      #composer-surface { border-radius:28px; background:#121212; }
      #prompt-textarea { min-height:94px; outline:none; }
      #prompt-textarea:focus-visible { outline:2px solid #55cfff; outline-offset:4px; }
      .toolbar { display:flex; justify-content:space-between; align-items:center; }
      .toolbar button { border:1px solid #52deff55; background:#051e3380; border-radius:12px; }
      #send-button { background:#52deff; color:#062136; border-radius:50%; width:36px; height:36px; border:0; }
      .note { color:#8ba6b8; text-align:center; font-size:11px; }
      .bottom-note { text-align:right; font-size:11px; color:#7ea8bc; }
    }
    @layer utilities {
      .brand { padding:27px 23px; } nav { padding:2px 14px; } nav a { padding:10px 14px; margin:6px 0; } nav small { margin:30px 14px 10px; }
      footer { padding:19px 25px; } main header { height:82px; padding:0 32px; } .fixture-tag { padding:6px 13px; }
      h1 { margin:0 0 13px; } .subtitle { margin:0 0 37px; } .context { margin-bottom:18px; } .context span { padding:6px 14px; }
      #composer-surface { padding:22px 24px 16px; } .toolbar { margin-top:18px; } .toolbar button { padding:5px 12px; } .note { margin-top:17px; } .bottom-note { padding:16px 32px; }
    }
    @media(max-width:760px) { .app {grid-template-columns:170px minmax(0,1fr);} .brand {font-size:16px;padding:18px 12px;} nav {padding:0 7px;} nav a {padding:8px;} main header {padding:0 15px;} .fixture-tag {display:none;} #thread {width:calc(100% - 24px);} h1 {font-size:24px;} #composer-surface {padding:16px;} .context {flex-wrap:wrap;} }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar"><div class="brand"><span>ChatGPT</span><span>◫</span></div>
      <nav><a class="new-chat" href="#new">＋　新聊天</a><a href="#search">⌕　搜索聊天</a><a href="#images">▧　图片</a><small>项目</small><a href="#project">▱　自己的小实验</a><small>最近的聊天</small><a aria-current="page" href="#current">线框蓝光 · 外观调整</a><a href="#ideas">在夜色里写下灵感</a><a href="#maintenance">慢慢维护这个空间</a><a href="#original">蓝色、黑色与一点光</a></nav>
      <footer id="sidebar-footer">◉　测试用户<br><small>本地验证 · 无账号数据</small></footer>
    </aside>
    <main id="main"><header><span>ChatGPT　⌄</span><span class="fixture-tag">真实扩展渲染 / 本地模拟页面</span></header>
      <section id="thread"><h1>探索未知之境</h1><p class="subtitle">让这个空间，更接近自己喜欢的样子。</p><div class="context"><span>▱　个人小实验</span><span>◈　线框蓝光</span></div>
        <form id="composer-form" class="group/composer"><div id="composer-surface" class="bg-token-bg-primary cursor-text"><div id="prompt-textarea" role="textbox" aria-label="输入消息" contenteditable="true">描述你想构建的内容…</div><div class="toolbar"><button type="button" aria-label="附件">＋</button><span>模型选择　⌄　　<button id="send-button" type="button" aria-label="发送">↑</button></span></div></div></form>
        <p class="note">保留原生圆角、间距与操作；背景和皮肤均在本机运行。</p>
      </section><div class="bottom-note">夜航 0.1.3 · 夹具截图，非当前账号页面</div>
    </main>
  </div>
</body>
</html>
